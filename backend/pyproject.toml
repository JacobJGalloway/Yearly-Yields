[project]
name = "yearly-yields-backend"
version = "0.1.0"
description = "Agricultural monitoring and yield prediction system"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5.0",

    # AI
    "anthropic[mcp]>=0.96",

    # Validation / config
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",

    # Email
    "resend>=2.0",

    # HTTP client (NOAA)
    "httpx>=0.27",

    # Reliability
    "tenacity>=8.5",

    # Form data
    "python-multipart>=0.0.9",

    # PDF generation
    "xhtml2pdf>=0.2.17",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "coverage>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/db/migrations/*"]
