[project]
name = "yearly-yields-backend"
version = "0.1.0"
description = "Agricultural monitoring and yield prediction system"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # AI
    "anthropic>=0.34",

    # Validation / config
    "pydantic>=2.8",
    "pydantic-settings>=2.4",

    # Email
    "sendgrid>=6.11",

    # HTTP client (NOAA)
    "httpx>=0.27",

    # Reliability
    "tenacity>=8.5",

    # Form data
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "coverage>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/db/migrations/*"]
