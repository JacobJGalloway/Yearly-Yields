<div class="login-page">
  <div class="login-wrapper">
    <div class="login-logo">
      <img [src]="logoSrc" alt="Yearly Yields" />
    </div>

    <mat-card class="login-card">
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <p class="reset-hint">Enter your new password.</p>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>New Password</mat-label>
            <input matInput type="password" formControlName="new_password" autocomplete="new-password" />
            <mat-error *ngIf="form.get('new_password')?.hasError('required')">Password is required</mat-error>
            <mat-error *ngIf="form.get('new_password')?.hasError('minlength')">At least 8 characters</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Confirm Password</mat-label>
            <input matInput type="password" formControlName="confirm_password" autocomplete="new-password" />
            <mat-error *ngIf="form.hasError('mismatch')">Passwords do not match</mat-error>
          </mat-form-field>

          <div *ngIf="error" class="login-error">{{ error }}</div>

          <button mat-flat-button class="full-width login-btn" type="submit" [disabled]="form.invalid || loading">
            <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
            <span *ngIf="!loading">Set New Password</span>
          </button>
        </form>
        <div class="forgot-footer">
          <a routerLink="/login">Back to Sign In</a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
