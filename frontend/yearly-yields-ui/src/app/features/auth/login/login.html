<div class="login-page">
  <div class="login-wrapper">
    <div class="login-logo">
      <img [src]="logoSrc" alt="Yearly Yields" />
    </div>

  <mat-card class="login-card">
    <mat-card-content>
      <div *ngIf="resetSuccess" class="reset-success">Password updated — sign in with your new password.</div>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <div *ngIf="error$ | async as error" class="login-error">
          {{ error }}
        </div>

        <button
          mat-flat-button
          class="full-width login-btn"
          type="submit"
          [disabled]="form.invalid || (loading$ | async)"
        >
          <mat-spinner *ngIf="loading$ | async" diameter="20"></mat-spinner>
          <span *ngIf="!(loading$ | async)">Sign In</span>
        </button>
      </form>
      <div class="forgot-footer">
        <a routerLink="/forgot-password">Forgot password?</a>
      </div>
    </mat-card-content>
  </mat-card>
  </div>
</div>
