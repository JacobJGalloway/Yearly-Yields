<div class="login-page">
  <div class="login-wrapper">
    <div class="login-logo">
      <img [src]="logoSrc" alt="Yearly Yields" />
    </div>

    <mat-card class="login-card">
      <mat-card-content>
        @if (submitted) {
          <p class="reset-sent">If that email is registered, a reset link is on its way. Check your inbox.</p>
          <a mat-stroked-button routerLink="/login" class="full-width back-btn">Back to Sign In</a>
        } @else {
          <form [formGroup]="form" (ngSubmit)="submit()">
            <p class="reset-hint">Enter your email and we'll send you a link to reset your password.</p>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" autocomplete="email" />
              <mat-error>Enter a valid email</mat-error>
            </mat-form-field>

            <button mat-flat-button class="full-width login-btn" type="submit" [disabled]="form.invalid || loading">
              <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
              <span *ngIf="!loading">Send Reset Link</span>
            </button>
          </form>
          <div class="forgot-footer">
            <a routerLink="/login">Back to Sign In</a>
          </div>
        }
      </mat-card-content>
    </mat-card>
  </div>
</div>
